[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "arduino-led-control"
version = "0.1.2"
description = "Arduino LED control module with compiled firmware in wheel"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Thomas Dietel", email = "tom@dietel.net"}
]
keywords = ["arduino", "serial", "led", "control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyserial>=3.5",
    "cmd2>=2.0",
]

[project.optional-dependencies]
web = [
    "flask>=2.0",
]
tui = [
    "colorama>=0.4.0",
]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/tdietel/arduino-led-control"
Documentation = "https://github.com/tdietel/arduino-led-control#readme"
Repository = "https://github.com/tdietel/arduino-led-control.git"
Issues = "https://github.com/tdietel/arduino-led-control/issues"

[project.scripts]
ledcontrol = "arduino_led_control.cli:main"
ledcontrol-tui = "arduino_led_control.tui:main"

[tool.setuptools]
packages = ["arduino_led_control"]
include-package-data = true

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
